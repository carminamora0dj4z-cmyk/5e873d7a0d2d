      - run:
          name: Mark ECN on congestion
          command: LIONSS_LP=1 ./build/ecn_mark --conf aqm.cfg --codel
  groundTrack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
